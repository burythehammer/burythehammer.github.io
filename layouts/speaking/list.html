{{ define "main" }}
<div id="speaking">
	{{ range .Site.Data.speaking }}
		<div class="speak">
			<h1>{{ if .url }}<a href="{{ .url }}">{{ .event }}</a>{{ else }}{{ .event }}{{ end }}</h1>
			<p class="tagline">{{ .location }}</p>
			<div class="description">{{ .talk | markdownify }}</div>
			<div class="meta">
				<span class="time">{{ .date }}</span>
			</div>
		</div>
	{{ end }}
</div>
{{ end }}
